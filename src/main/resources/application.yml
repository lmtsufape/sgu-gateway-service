server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery:8761/eureka/
    registerWithEureka: true
    fetchRegistry: true
  instance:
    hostname: gateway
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 5

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG

common:
  front: http://localhost:3000,https://sgiufape.vercel.app,https://lmtsteste20.ufape.edu.br

spring:
  application:
    name: sgu-gateway-service
  profiles:
    active: docker

  # Redis
  data:
    redis:
      host: redis
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/sgu-ufape/protocol/openid-connect/certs

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

          routes:
            - id: sgu-auth-service
              uri: lb://sgu-auth-service
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            - id: sgu-prae-service
              uri: lb://sgu-prae-service
              predicates:
                - Path=/prae/**
              filters:
                - StripPrefix=1