version: '3.9'

services:
  gateway:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - sgu-networks
    depends_on:
      - redis

  # Serviço do Redis
  redis:
    image: redis:7-alpine
    container_name: sgu-redis
    ports:
      - "6379:6379"
    networks:
      - sgu-networks
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data

networks:
  sgu-networks:
    external: true

volumes:
  redis-data: